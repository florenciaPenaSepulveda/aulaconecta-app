name: App CI

on:
  push:
    branches: [main, development, testing]
  pull_request:

jobs:
  test:
    name: Tipos, pruebas con cobertura y empaquetado web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Pruebas con cobertura
        run: npm run test:cov

      - name: Empaquetar la versión web
        run: npx expo export --platform web
